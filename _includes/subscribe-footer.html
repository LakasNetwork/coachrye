{% if site.mailchimp-list or site.sendfox-list %}
{% if page.nosubscribe == nil %}
<!-- Bottom Alert Bar
================================================== -->
<div class="alertbar">
	<div class="container text-center">
		<span><img src="{{ site.baseurl }}/{{ site.logo }}" alt="{{site.title}}" width="30px">Join a community of tech-forward leaders receiving our insights every week.</span>
{% if site.mailchimp-list %}
        <form action="{{site.mailchimp-list}}" method="post" name="mc-embedded-subscribe-form" class="wj-contact-form validate" target="_blank" novalidate>
            <div class="mc-field-group">
            <input type="email" placeholder="Email" name="EMAIL" class="required email" id="mce-EMAIL" autocomplete="on" required>
            <input type="submit" value="Subscribe" name="subscribe" class="heart">
            </div>
        </form>
{% elsif site.sendfox-list %}
        <form method="post" action="{{ site.sendfox-list }}" class="sendfox-form" id="{{ site.sendfox-id }}" data-async="true" data-recaptcha="true">
            <div class="mc-field-group d-flex align-items-center">
            <input type="text" placeholder="NoName" name="first_name" value="NoName" id="sendfox_form_name" required class="d-none"> 
            <input type="email" placeholder="your@email.com" name="email" class="required email flex-grow-1 mr-1" id="email" autocomplete="on" required>
            <label class="d-none">
            <input type="checkbox" name="gdpr" value="1" required checked>
            I agree to receive email updates and promotions.
            </label>
            <button type="submit" class="btn btn-primary btn-sm">Count Me In!</button>
            </div>
        </form>
{% endif %}
{% endif %}
        
	</div>
</div>
{% endif %}
